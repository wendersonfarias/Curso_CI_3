name: Entrega Continua

on:
  workflow_call:

jobs:

  docker:
    runs-on: ubuntu-latest
    steps:
      
    - name: Download a Build Artifact
      uses: actions/download-artifact@v4
      with:
    # Artifact name
        name: programa

    - uses: actions/checkout@v4

    - name: Deploy to EC2
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_AWS }}
        REMOTE_HOST: ${{ secrets.REMOTE_HOST_AWS }}
        REMOTE_USER: ${{ secrets.REMOTE_USER_AWS }}
        TARGET: /home/${{ secrets.REMOTE_USER_AWS }}
        EXCLUDE: "postgres-data"
        SCRIPT_AFTER: |
          export HOST: ${{ secrets.DB_HOST_AWS }}
          export USER: ${{ secrets.DB_USER_AWS }}
          export PASSWORD: ${{ secrets.DB_PASSWORD_AWS }}
          export DBNAME: ${{ secrets.DB_NAME_AWS }}
          EXPORT PORT: ${{ secrets.DB_PORT_AWS }}
          
      