name: Entrega Continua

on:
  workflow_call:

jobs:

  AWS:
    runs-on: ubuntu-latest
    steps:
      
    - name: Download a Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: programa
        path: ./
    #- uses: actions/checkout@v3

    # - uses: actions/checkout@v4

    - name: Deploy to EC2
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_AWS }}
        REMOTE_HOST: ${{ secrets.REMOTE_HOST_AWS }}
        REMOTE_USER: ${{ secrets.REMOTE_USER_AWS }}
        TARGET: /home/${{ secrets.REMOTE_USER_AWS }}
        EXCLUDE: "postgres-data"

    - name: executing remote ssh commands using password
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.REMOTE_HOST_AWS }}
        username: ${{ secrets.REMOTE_USER_AWS }}
        key: ${{ secrets.SSH_PRIVATE_KEY_AWS }}
        port: 22
        script: |
          cd /home/${{ secrets.REMOTE_USER_AWS }}
          chmod +x main
          
          nohup env DB_HOST=${{ secrets.DB_HOST_AWS }} \
          DB_USER=${{ secrets.DB_USER_AWS }} \
          DB_PASSWORD=${{ secrets.DB_PASSWORD_AWS }} \
          DB_NAME=${{ secrets.DB_NAME_AWS }} \
          DB_PORT=${{ secrets.DB_PORT_AWS }} \
          ./main > nohup.out 2> nohup.err < /dev/null &          
                