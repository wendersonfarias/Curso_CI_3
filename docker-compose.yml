version: '3'
services:
  postgres:
    image: bitnami/postgresql:latest
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=root      
      - POSTGRESQL_ENABLE_TLS=yes  # Habilita SSL/TLS
      - POSTGRESQL_TLS_CERT_FILE=/certs/server.crt
      - POSTGRESQL_TLS_KEY_FILE=/certs/server.key
    ports:
      - "5432:5432"
    volumes:
      - ./certs:/certs  # Monta a pasta de certificados no container
      - /postgres-data:/var/lib/postgresql/data
    command: >
      postgres -c ssl=on
      -c ssl_cert_file=/certs/server.crt
      -c ssl_key_file=/certs/server.key 

  app:
    image: golang:1.22
    command:
      - go
      - run
      - main.go
    volumes:
      - ./:/app
    working_dir: /app
    ports:
      - 8080:8080
    depends_on:
      - postgres
    environment:
      - DB_HOST=localhost
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=root
      - DB_PORT=5432